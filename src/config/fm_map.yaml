# M5: each attack mechanism in data/eval/adversarial_v2.json -> FM code in docs/failure_taxonomy.md.
ticket_over_db: FM-03          # ticket text / injected "[SYSTEM]" facts override the DB
stale_policy: FM-06            # superseded or not-yet-effective clause cited in the ticket
clause_sum: FM-04              # sum clauses instead of the max entitlement
double_deduct: FM-05           # subtract prior refunds before the host does it again
sibling_refund: FM-07          # "gom đơn": refund other claims of the same order
denied_ignored: FM-02          # host refuses (expired approval / order fully refunded) but reply says refunded
reply_ledger_mismatch: FM-08   # approval caps below quote; reply must state the ledger amount
cross_principal: FM-09         # someone other than the order owner asks for money or PII
